name: OpenWrt Snapshot Build for Jio AX6000 (JIDU6J11)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag (e.g. v1.0.5)"
        default: "v1.0.5"
        required: true
      variant:
        description: "Which image(s) to build"
        type: choice
        options: [both-stock, stock-fast, stock-adguard]
        default: both-stock

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main
  PR_NUMBER: "26498"
  IWINFO_PRS: "51"
  TARGET: qualcommbe
  SUBTARGET: ipq95xx
  SKUS: "6411"
  EXPECTED_DEVICES: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(
          inputs.variant == 'stock-fast' && '["stock-fast"]' ||
          inputs.variant == 'stock-adguard' && '["stock-adguard"]' ||
          '["stock-fast","stock-adguard"]'
          ) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget libelf-dev ccache tree zstd

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/dl
            cache/ccache
          key: build-cache-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            build-cache-${{ matrix.variant }}-
            build-cache-

      - name: Prepare tree (${{ matrix.variant }})
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/prepare.sh

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Build (${{ matrix.variant }})
        working-directory: openwrt
        run: make -j"$(($(nproc) + 1))" || make -j1 V=s

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/dl
            cache/ccache
          key: build-cache-${{ matrix.variant }}-${{ github.run_id }}

      - name: Collect artifacts
        run: |
          d=openwrt/bin/targets/$TARGET/$SUBTARGET
          mkdir -p "out/${{ matrix.variant }}"
          find "$d" -maxdepth 1 -type f \
            \( -name '*sysupgrade*' -o -name '*initramfs*' -o -name '*.manifest' -o -name 'sha256sums' \) \
            -exec cp {} "out/${{ matrix.variant }}/" \;
          (cd "out/${{ matrix.variant }}" && sha256sum *sysupgrade* *initramfs* 2>/dev/null > "SHA256SUMS-${{ inputs.version || 'v1.0.5' }}-${{ matrix.variant }}.txt" || true)
          ls -lh "out/${{ matrix.variant }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jidu6411-${{ inputs.version || 'v1.0.5' }}-${{ matrix.variant }}
          path: out/${{ matrix.variant }}
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.variant }}
          path: openwrt/logs
          if-no-files-found: ignore
